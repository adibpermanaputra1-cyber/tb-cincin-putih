    // ==========================================
    // 🖨️ ESC/POS GENERATOR UNTUK BLUETOOTH THERMAL
    // ==========================================
    function generateEscPosCommands(receipt, profile, paperWidth = 58) {
      const maxChars = paperWidth === 80 ? 48 : 32;
      const encoder = new TextEncoder();
      const chunks = [];
      const addRaw = (b) => chunks.push(new Uint8Array(b));
      const addText = (s) => chunks.push(encoder.encode(s));

      const ESC = 0x1B;
      const GS = 0x1D;

      addRaw([ESC, 0x40]); // Reset
      addRaw([ESC, 0x61, 0x01]); // Align Center

      // Header Toko
      addRaw([ESC, 0x45, 0x01]); // Bold ON
      addRaw([GS, 0x21, 0x11]);  // Double Height & Width
      addText((profile.name || 'TB. CINCIN PUTIH') + '\n');
      
      addRaw([GS, 0x21, 0x00]);  // Normal
      addRaw([ESC, 0x45, 0x00]); // Bold OFF
      addText((profile.address || 'Bekasi') + '\n');
      addText('Telp/WA: ' + (profile.phone || '-') + '\n');
      addText('*** NOTA RESMI PENJUALAN ***\n');
      addText('-'.repeat(maxChars) + '\n');

      // Metadata Transaksi (Align Left)
      addRaw([ESC, 0x61, 0x00]);
      addText(`No.Nota: ${receipt.id}\n`);
      addText(`Tanggal: ${receipt.date}\n`);
      addText(`Mandor : ${receipt.customer}\n`);
      addText('-'.repeat(maxChars) + '\n');

      // Rincian Item
      receipt.items.forEach((item) => {
        addRaw([ESC, 0x45, 0x01]);
        addText(`${item.name}\n`);
        addRaw([ESC, 0x45, 0x00]);

        const leftStr = `  ${item.qty} ${item.sellingUnit} x ${item.activePrice.toLocaleString('id-ID')}`;
        const rightStr = (item.qty * item.activePrice).toLocaleString('id-ID');
        const spaces = Math.max(1, maxChars - leftStr.length - rightStr.length);
        addText(leftStr + ' '.repeat(spaces) + rightStr + '\n');
      });

      addText('-'.repeat(maxChars) + '\n');

      // Total & Bayar (Align Right)
      addRaw([ESC, 0x61, 0x02]);
      if (receipt.discount > 0) {
        addText(`Diskon: -Rp ${receipt.discount.toLocaleString('id-ID')}\n`);
      }
      addRaw([ESC, 0x45, 0x01]); // Bold ON
      addText(`TOTAL: Rp ${receipt.total.toLocaleString('id-ID')}\n`);
      addRaw([ESC, 0x45, 0x00]); // Bold OFF
      addText(`Metode: ${receipt.paymentMethod}\n`);
      if (receipt.paymentMethod === 'Tunai') {
        addText(`Bayar : Rp ${(receipt.paid || receipt.total).toLocaleString('id-ID')}\n`);
        addText(`Kembali: Rp ${(receipt.change || 0).toLocaleString('id-ID')}\n`);
      }

      // Footer
      addRaw([ESC, 0x61, 0x01]);
      addText('-'.repeat(maxChars) + '\n');
      addText((profile.footer || 'Terima kasih atas kunjungan Anda') + '\n\n\n');
      addRaw([GS, 0x56, 0x41, 0x03]); // Auto-cut

      const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
      const combined = new Uint8Array(totalLen);
      let offset = 0;
      for (const chunk of chunks) {
        combined.set(chunk, offset);
        offset += chunk.length;
      }
      return combined;
    }

      const lowStockProducts = useMemo(() => products.filter(p => p.stock <= (p.minStock || 10)), [products]);

      // KASIR POS HANDLER
      const addToCart = (product, unitName, unitPrice, multiplier = 1) => {
        if (product.stock <= 0) {
          alert(`Stok ${product.name} habis!`);
          return;
        }
        const cartKey = `${product.id}-${unitName}`;
        setCart(prev => {
          const exist = prev.find(i => i.cartKey === cartKey);
          if (exist) {

        if (cart.length === 0) return;
        if (paymentMethod === 'Tunai' && Number(cashInput) < cartGrandTotal && cashInput !== '') {
          alert('Nominal tunai kurang dari total tagihan!');
          return;
        }

        const invoiceId = 'INV-' + Date.now().toString().slice(-6);
        const newTx = {
          id: invoiceId,
          date: new Date().toLocaleString('id-ID'),
          customer: selectedCustomer,
          paymentMethod,
          items: [...cart],
          subtotal: cartSubtotal,
          discount: cartDiscount,
          total: cartGrandTotal,
          paid: paymentMethod === 'Tunai' ? (Number(cashInput) || cartGrandTotal) : cartGrandTotal,
          change: paymentMethod === 'Tunai' ? changeAmount : 0,
          profit: cart.reduce((s, it) => s + ((it.activePrice - it.costPrice) * it.qty), 0) - cartDiscount
        };

        // Potong stok produk
        setProducts(prev => prev.map(p => {
          const inCart = cart.filter(c => c.id === p.id);
          if (inCart.length === 0) return p;
          const deduct = inCart.reduce((sum, item) => sum + (item.qty * item.multiplier), 0);
          return { ...p, stock: Math.max(0, p.stock - deduct) };
        }));

        // Catat kasbon bila tempo
        if (paymentMethod.includes('Tempo') || paymentMethod.includes('Kasbon')) {
          setCustomers(prev => prev.map(c => c.name === selectedCustomer ? { ...c, debt: c.debt + cartGrandTotal } : c));
        }

        setTransactions(prev => [newTx, ...prev]);
        setPrintReceipt(newTx);
        setCart([]);
        setCashInput('');
        setDiscountPercent(0);
      };

      // BLUETOOTH PRINT FUNCTION
      const printBluetoothESC = async (receipt, width = 58) => {
        if (!navigator.bluetooth) {
          alert('Web Bluetooth tidak didukung browser ini. Silakan gunakan Google Chrome atau Cetak Driver System.');
          return;
        }
        try {
          setIsBluetoothPrinting(true);
          setBluetoothStatus('Memindai printer Bluetooth terdekat...');
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '000018f0-0000-1000-8000-00805f9b34fb',
              'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
              '49535343-fe7d-4ae5-8fa9-9fafd205e455'
            ]
          });
          setBluetoothStatus(`Menghubungkan ke ${device.name || 'Printer'}...`);
          const server = await device.gatt.connect();
          const services = await server.getPrimaryServices();
          let writeChar = null;
          for (const s of services) {
            try {
              const chars = await s.getCharacteristics();
              for (const c of chars) {
                if (c.properties.write || c.properties.writeWithoutResponse) {
                  writeChar = c;
                  break;
                }
              }
              if (writeChar) break;
            } catch (e) {}
          }
          if (!writeChar) throw new Error('Karakteristik Write printer tidak ditemukan.');

          setBluetoothStatus('Mengirim data struk ESC/POS...');
          const escData = generateEscPosCommands(receipt, profile, width);
          const CHUNK = 512;
          for (let i = 0; i < escData.length; i += CHUNK) {
            const slice = escData.slice(i, i + CHUNK);
            if (writeChar.writeValueWithoutResponse) {
              await writeChar.writeValueWithoutResponse(slice);
            } else {
              await writeChar.writeValue(slice);
            }
          }
          setBluetoothStatus('Struk berhasil dicetak!');
          setTimeout(() => {
            setIsBluetoothPrinting(false);
            setBluetoothStatus('');
          }, 1500);
        } catch (err) {
          console.error(err);
          alert('Gagal cetak Bluetooth: ' + err.message);
          setIsBluetoothPrinting(false);
          setBluetoothStatus('');
        }
      };

      // SYSTEM PRINT DRIVER

              {/* ======================================================== */}
              {currentTab === 'settings' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <div className="flex gap-2 border-b border-slate-800 pb-2">
                    <button onClick={() => setSettingsSubTab('bank')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${settingsSubTab === 'bank' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>Rekening Bank & QRIS</button>
                    <button onClick={() => setSettingsSubTab('profile')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${settingsSubTab === 'profile' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>Profil & Kontak Toko</button>
                    <button onClick={() => setSettingsSubTab('receipt')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${settingsSubTab === 'receipt' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400'}`}>Format Struk & Footer</button>
                  </div>

                  {settingsSubTab === 'bank' && (
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                      <h3 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                        <i className="fa-solid fa-building-columns text-emerald-400"></i> Rekening Bank Utama Toko
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="text-xs text-slate-400 block mb-1">Nama Bank</label>
                          <input type="text" value={profile.bankName} onChange={e => setProfile({ ...profile, bankName: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                        </div>
                        <div>
                          <label className="text-xs text-slate-400 block mb-1">Nomor Rekening</label>
                          <input type="text" value={profile.bankAcc} onChange={e => setProfile({ ...profile, bankAcc: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                        </div>
                        <div>
                          <label className="text-xs text-slate-400 block mb-1">Atas Nama Pemilik</label>
                          <input type="text" value={profile.bankHolder} onChange={e => setProfile({ ...profile, bankHolder: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                        </div>
                      </div>
                    </div>
                  )}

                  {settingsSubTab === 'profile' && (
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                      <h3 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                        <i className="fa-solid fa-id-card text-emerald-400"></i> Identitas Toko Bangunan
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="text-xs text-slate-400 block mb-1">Nama Toko</label>
                          <input type="text" value={profile.name} onChange={e => setProfile({ ...profile, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                        </div>
                        <div>
                          <label className="text-xs text-slate-400 block mb-1">Owner / Pemilik</label>
                          <input type="text" value={profile.owner} onChange={e => setProfile({ ...profile, owner: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                        </div>
                        <div className="sm:col-span-2">
                          <label className="text-xs text-slate-400 block mb-1">Alamat Gudang & Toko</label>
                          <input type="text" value={profile.address} onChange={e => setProfile({ ...profile, address: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                        </div>
                      </div>
                    </div>
                  )}

                  {settingsSubTab === 'receipt' && (
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                      <h3 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                        <i className="fa-solid fa-receipt text-emerald-400"></i> Footer Struk & Syarat Retur
                      </h3>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Pesan Penutup Kaki Nota</label>
                        <textarea rows="3" value={profile.footer} onChange={e => setProfile({ ...profile, footer: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs"></textarea>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>

          {/* ======================================================== */}
          {/* 🖨️ MODAL CETAK STRUK BLUETOOTH & SYSTEM PRINT            */}
          {/* ======================================================== */}
          {printReceipt && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3 sm:p-4 no-print overflow-y-auto">
              <div className="bg-white text-slate-900 rounded-2xl p-5 sm:p-6 max-w-lg w-full font-mono text-xs shadow-2xl space-y-4 max-h-[95vh] overflow-y-auto">
                
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <span className="font-bold text-slate-800 text-xs">Pilih Ukuran Kertas:</span>
                  <div className="flex gap-1">
                    <button type="button" onClick={() => setPrintFormat('thermal58')} className={`px-2.5 py-1 rounded text-xs font-bold ${printFormat === 'thermal58' ? 'bg-slate-950 text-white' : 'bg-slate-200'}`}>Thermal 58mm</button>
                    <button type="button" onClick={() => setPrintFormat('thermal80')} className={`px-2.5 py-1 rounded text-xs font-bold ${printFormat === 'thermal80' ? 'bg-slate-950 text-white' : 'bg-slate-200'}`}>Thermal 80mm</button>
                    <button type="button" onClick={() => setPrintFormat('dotmatrix')} className={`px-2.5 py-1 rounded text-xs font-bold ${printFormat === 'dotmatrix' ? 'bg-slate-950 text-white' : 'bg-slate-200'}`}>Dot Matrix / A4</button>
                  </div>
                </div>

                {bluetoothStatus && (
                  <div className="p-3 rounded-xl bg-sky-50 border border-sky-200 text-sky-800 text-xs font-semibold flex items-center gap-2 animate-pulse">
                    <i className="fa-brands fa-bluetooth text-base text-sky-600"></i>
                    <span>{bluetoothStatus}</span>
                  </div>
                )}

                <div id="printable-area" className={`mx-auto bg-white text-black ${printFormat === 'thermal58' ? 'max-w-[54mm]' : printFormat === 'thermal80' ? 'max-w-[76mm]' : 'w-full'}`}>
                  <div className="text-center border-b border-dashed border-black pb-2 mb-2">
                    <h2 className="font-black text-xs sm:text-sm uppercase">{profile.name}</h2>
                    <p className="text-[9px]">{profile.address}</p>
                    <p className="text-[9px]">Telp/WA: {profile.phone}</p>
                    <div className="mt-1 font-bold text-[10px] uppercase">*** NOTA RESMI KASIR ***</div>
                  </div>

                  <div className="flex justify-between text-[9px] mb-1">
                    <span>No: <strong>{printReceipt.id}</strong></span>
                    <span>Tgl: {printReceipt.date}</span>
                  </div>
                  <div className="text-[9px] mb-2">
                    <span>Pelanggan: <strong>{printReceipt.customer}</strong></span>
                  </div>

                  <div className="border-t border-b border-dashed border-black py-1.5 space-y-1.5 my-1">
                    {printReceipt.items.map((item, i) => (
                      <div key={i} className="flex justify-between text-[10px] leading-tight">
                        <div>
                          <div className="font-bold">{item.name}</div>
                          <div className="text-[9px] text-gray-700">{item.qty} {item.sellingUnit} x {formatRupiah(item.activePrice)}</div>
                        </div>
                        <span className="font-bold">{formatRupiah(item.activePrice * item.qty)}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-1 text-right text-[10px] pt-1">
                    <div className="flex justify-between font-black text-xs pt-1 border-t border-black">
                      <span>TOTAL:</span>
                      <span>{formatRupiah(printReceipt.total)}</span>
                    </div>
                    <div className="flex justify-between text-gray-700 text-[9px]">
                      <span>Metode:</span>
                      <span>{printReceipt.paymentMethod}</span>
                    </div>
                  </div>

                  <div className="text-center text-[8px] text-gray-700 border-t border-dashed border-black pt-2 mt-2 leading-tight">
                    {profile.footer}
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-200">
                  <button 
                    type="button"
                    disabled={isBluetoothPrinting}
                    onClick={() => printBluetoothESC(printReceipt, printFormat === 'thermal80' ? 80 : 58)} 
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold text-xs flex items-center justify-center gap-2"
                  >
                    <i className="fa-brands fa-bluetooth text-sm"></i>
                    <span>{isBluetoothPrinting ? 'Mencetak...' : 'Cetak Bluetooth (ESC/POS)'}</span>
                  </button>
                  <button 
                    type="button"
                    onClick={() => printSystemDriver(printFormat)} 
                    className="px-3.5 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs"
                  >
                    Cetak Driver System / PDF
                  </button>
                  <button 
                    type="button"
                    onClick={() => setPrintReceipt(null)} 
                    className="px-3.5 py-2.5 rounded-xl bg-slate-200 text-slate-800 font-bold text-xs"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
