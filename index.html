      useEffect(() => { localStorage.setItem('tb_cincinputih_products_v5', JSON.stringify(products)); }, [products]);

      useEffect(() => { localStorage.setItem('tb_cincinputih_employees_v5', JSON.stringify(employees)); }, [employees]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_transactions_v5', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_expenses_v5', JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_profile_v5', JSON.stringify(profile)); }, [profile]);

      // HANDLER BUKA MODAL TAMBAH PRODUK
      const handleOpenAddProductModal = () => {
        setEditingProduct(null);

          code: product.code || '',
          name: product.name || '',
          category: product.category || 'Semen & Pasir',

          multiUnit: product.multiUnit || '',
          image: product.image || 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=400'
        });
        setIsProductModalOpen(true);
      };

      // HANDLER SIMPAN PRODUK DARI MODAL
      const handleSaveProductModal = (e) => {
        e.preventDefault();
        if (!productFormData.name.trim()) {
          alert('Nama produk material wajib diisi!');
          return;
        }

        const formattedProduct = {
          id: editingProduct ? editingProduct.id : 'p-' + Date.now(),
          code: productFormData.code.trim().toUpperCase() || 'MAT-' + Math.floor(100 + Math.random() * 900),
          name: productFormData.name.trim(),
          category: productFormData.category,
          unit: productFormData.unit,

          wholesalePrice: Number(productFormData.wholesalePrice) || Number(productFormData.price) || 0,

          minStock: Number(productFormData.minStock) || 5,
          location: productFormData.location.trim() || 'Gudang Utama',
          multiUnit: productFormData.multiUnit.trim(),
          image: productFormData.image.trim() || 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=400'

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? formattedProduct : p));
        } else {
          setProducts(prev => [formattedProduct, ...prev]);
        }

        setIsProductModalOpen(false);

      // EXPORT & RESTORE JSON
      const handleExportBackupJson = () => {
        const fullBackup = {
          app: 'TB. CINCIN PUTIH SYSTEM POS V5',
          version: '5.0.0',
          exportedAt: new Date().toISOString(),
          profile,
          products,
          customers,
          suppliers,
          employees,
          transactions,
          expenses
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-tb-cincinputih-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('File backup JSON berhasil diunduh ke komputer!');
      };

      const handleImportBackupJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.products) setProducts(data.products);
            if (data.customers) setCustomers(data.customers);
            if (data.suppliers) setSuppliers(data.suppliers);
            if (data.employees) setEmployees(data.employees);
            if (data.transactions) setTransactions(data.transactions);
            if (data.expenses) setExpenses(data.expenses);
            if (data.profile) setProfile(data.profile);
            alert('Database toko berhasil dipulihkan dari file JSON!');
          } catch (err) {
            alert('File JSON tidak valid!');
          }
        };
        reader.readAsText(file);
      };

        if (product.stock <= 0) {
          alert(`Stok ${product.name} habis!`);
          return;
        }
        setCart(prev => {
          const exist = prev.find(item => item.id === product.id);
          if (exist) {
            if (exist.qty >= product.stock) {
              alert('Jumlah beli melebihi stok gudang!');
              return prev;
            }
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1, isWholesale: false, activePrice: product.price }];
        });
      };

      const updateQty = (id, newQty) => {
        if (newQty <= 0) {
          setCart(prev => prev.filter(item => item.id !== id));
          return;
        }
        const prod = products.find(p => p.id === id);
        if (prod && newQty > prod.stock) {
          alert('Jumlah melebihi stok yang tersedia!');
          return;
        }
        setCart(prev => prev.map(item => item.id === id ? { ...item, qty: newQty } : item));
      };

      const toggleWholesalePrice = (id) => {
        setCart(prev => prev.map(item => {
          if (item.id === id && item.wholesalePrice) {
            const nextWholesale = !item.isWholesale;
            return {
              ...item,
              isWholesale: nextWholesale,
              activePrice: nextWholesale ? item.wholesalePrice : item.price
            };
          }
          return item;
        }));
      };

      const subtotalCart = useMemo(() => cart.reduce((acc, item) => acc + (item.activePrice * item.qty), 0), [cart]);
      const discountAmount = useMemo(() => (subtotalCart * discountPercent) / 100, [subtotalCart, discountPercent]);
      const taxAmount = useMemo(() => ((subtotalCart - discountAmount) * taxPercent) / 100, [subtotalCart, discountAmount, taxPercent]);
      const grandTotal = useMemo(() => subtotalCart - discountAmount + taxAmount, [subtotalCart, discountAmount, taxPercent]);
      const changeAmount = useMemo(() => {
        const cash = Number(cashInput) || 0;
        return cash >= grandTotal ? cash - grandTotal : 0;
      }, [cashInput, grandTotal]);

      const handleCheckout = () => {
        if (cart.length === 0) return;
        if (paymentMethod === 'Tunai' && Number(cashInput) < grandTotal && cashInput !== '') {
          alert('Uang tunai kurang dari total tagihan!');
          return;
        }

        const invoiceId = 'INV-' + Date.now().toString().slice(-6);
        const newTx = {
          id: invoiceId,
          date: new Date().toLocaleString('id-ID'),
          customer: selectedCustomer,
          paymentMethod,
          items: [...cart],
          subtotal: subtotalCart,
          discount: discountAmount,
          tax: taxAmount,
          total: grandTotal,
          paid: paymentMethod === 'Tunai' ? (Number(cashInput) || grandTotal) : grandTotal,
          change: paymentMethod === 'Tunai' ? changeAmount : 0,
          profit: cart.reduce((sum, it) => sum + ((it.activePrice - it.costPrice) * it.qty), 0) - discountAmount
        };

        setProducts(prev => prev.map(prod => {
          const itemInCart = cart.find(c => c.id === prod.id);
          return itemInCart ? { ...prod, stock: Math.max(0, prod.stock - itemInCart.qty) } : prod;

        if (paymentMethod === 'Tempo / Kasbon (Hutang)') {
          setCustomers(prev => prev.map(cust => cust.name === selectedCustomer ? { ...cust, debt: cust.debt + grandTotal } : cust));

        setTransactions(prev => [newTx, ...prev]);
        setPrintReceipt(newTx);
        setReceiptDocType('pos');
        setPrintMode('thermal');
        setCart([]);
        setCashInput('');
        setDiscountPercent(0);

                  {/* Keranjang */}

                    <div className="flex-1 flex flex-col min-h-0">

                      <div className="grid grid-cols-2 gap-2 my-2">

                <div id="printable-area" className={printMode === 'thermal' ? 'thermal-mode' : 'dotmatrix-mode'}>
                  <div className="text-center border-b border-dashed border-slate-400 pb-2 mb-2">
                    <h2 className="font-bold text-sm sm:text-base tracking-wider uppercase">{profile.name}</h2>
                    <p className="text-[10px]">{profile.address}</p>
                    <p className="text-[10px]">Telp/WA: {profile.phone}</p>
                    <div className="mt-1 font-bold text-[11px] uppercase tracking-widest">*** STRUK PENJUALAN ***</div>
                  </div>

                  <div className="flex justify-between text-[10px] mb-1">
                    <span>No: <strong>{printReceipt.id}</strong></span>
                    <span>Tgl: {printReceipt.date}</span>
                  </div>
                  <div className="text-[10px] mb-2">
                    <span>Pelanggan: <strong>{printReceipt.customer}</strong></span>
                  </div>

                  <div className="border-t border-b border-dashed border-slate-400 py-1.5 space-y-1.5 my-1">
                    {printReceipt.items.map((item, i) => (
                      <div key={i} className="flex justify-between text-[11px]">
                        <div>
                          <div className="font-bold">{item.name}</div>
                          <div className="text-[10px] text-slate-600">{item.qty} {item.unit} x {formatRupiah(item.activePrice)}</div>
                        </div>
                        <span className="font-bold">{formatRupiah(item.activePrice * item.qty)}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-1 text-right text-[11px] pt-1">
                    <div className="flex justify-between font-black text-xs sm:text-sm pt-1 border-t border-slate-300">
                      <span>TOTAL:</span>
                      <span>{formatRupiah(printReceipt.total)}</span>
                    </div>
                  </div>

                  <div className="text-center text-[9px] text-slate-500 border-t border-dashed border-slate-400 pt-2 mt-2">{profile.footer}</div>
                </div>

                <div className="flex gap-2 pt-2 border-t border-slate-200">
                  <button onClick={() => window.print()} className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg">
                    <i className="fa-solid fa-print"></i> Cetak Struk
                  </button>
                  <button onClick={() => setPrintReceipt(null)} className="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs">Tutup</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
