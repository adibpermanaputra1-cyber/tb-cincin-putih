    function App() {
      // AUTH STATE (CLIENT-SIDE AUTH - NO SERVER 404)
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_auth_user');
        return saved ? JSON.parse(saved) : { name: 'Owner / Pemilik', role: 'owner', loggedIn: true };
      });

      const [loginPin, setLoginPin] = useState('');
      const [loginError, setLoginError] = useState('');

      // 10 MENU SIDEBAR KIRI
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);

      // STATE DATABASE LOCALSTORAGE
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_products_v4');
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_customers_v4');
        return saved ? JSON.parse(saved) : DEFAULT_CUSTOMERS;
      });

      const [suppliers, setSuppliers] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_suppliers_v4');
        return saved ? JSON.parse(saved) : DEFAULT_SUPPLIERS;
      });

      const [employees, setEmployees] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_employees_v4');
        return saved ? JSON.parse(saved) : DEFAULT_EMPLOYEES;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_transactions_v4');
        return saved ? JSON.parse(saved) : DEFAULT_TRANSACTIONS;
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_expenses_v4');
        return saved ? JSON.parse(saved) : DEFAULT_EXPENSES;
      });

      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('tb_cincinputih_profile_v4');
        return saved ? JSON.parse(saved) : {
          name: 'TB. CINCIN PUTIH',
          address: 'Jl. Cincin Putih Raya No. 88, Cibitung, Bekasi',
          phone: '0812-3456-7890 / 0857-7788-9900',
          bankBCA: 'BCA 8899-7711-22 a/n Cincin Putih',
          bankMandiri: 'Mandiri 156-00-1122334 a/n Cincin Putih',
          footer: 'Barang yang sudah dibeli tidak dapat ditukar/dikembalikan tanpa bukti nota kasir resmi.'
        };
      });

      // STATE KASIR POS
      const [cart, setCart] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCat, setSelectedCat] = useState('Semua');
      const [selectedCustomer, setSelectedCustomer] = useState('Pembeli Umum');
      const [paymentMethod, setPaymentMethod] = useState('Tunai');
      const [cashInput, setCashInput] = useState('');
      const [discountPercent, setDiscountPercent] = useState(0);
      const [taxPercent, setTaxPercent] = useState(0);

      // STATE CETAK
      const [printReceipt, setPrintReceipt] = useState(null);
      const [printMode, setPrintMode] = useState('thermal'); // thermal | dotmatrix
      const [receiptDocType, setReceiptDocType] = useState('pos'); // pos | delivery | invoice

      const fileInputRef = useRef(null);

      // SHORTCUT KEYBOARD F2 UNTUK KASIR
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F2') {
            e.preventDefault();
            setCurrentTab('pos');
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // SIMPAN STATE OTOMATIS
      useEffect(() => { localStorage.setItem('tb_cincinputih_auth_user', JSON.stringify(currentUser)); }, [currentUser]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_products_v4', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_customers_v4', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_suppliers_v4', JSON.stringify(suppliers)); }, [suppliers]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_employees_v4', JSON.stringify(employees)); }, [employees]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_transactions_v4', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_expenses_v4', JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem('tb_cincinputih_profile_v4', JSON.stringify(profile)); }, [profile]);

      // AUTH HANDLER LOKAL (ANTI 404)
      const handleLogin = (roleType, enteredPin) => {
        if (roleType === 'owner') {
          if (enteredPin === '1234' || enteredPin === 'admin' || enteredPin === '') {
            setCurrentUser({ name: 'Owner / Pemilik', role: 'owner', loggedIn: true });
            setLoginError('');
          } else {
            setLoginError('PIN Owner salah! (Gunakan 1234 atau klik Masuk Langsung)');
          }
        } else {
          setCurrentUser({ name: 'Kasir Toko', role: 'cashier', loggedIn: true });
          setLoginError('');
        }
      };

      const handleLogout = () => {
        setCurrentUser({ name: 'Guest', role: 'guest', loggedIn: false });
      };

      // FILTER KATEGORI & PRODUK
      const categoryList = useMemo(() => ['Semua', ...new Set(products.map(p => p.category))], [products]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = selectedCat === 'Semua' || p.category === selectedCat;
          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.code.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [products, selectedCat, searchQuery]);

      // EXPORT & RESTORE JSON
      const handleExportBackupJson = () => {
        const fullBackup = {
          app: 'TB. CINCIN PUTIH SYSTEM POS V4',
          version: '4.0.0',
          exportedAt: new Date().toISOString(),
          profile,
          products,
          customers,
          suppliers,
          employees,
          transactions,
          expenses
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-tb-cincinputih-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('Data toko berhasil diunduh ke file backup JSON!');
      };

      const handleImportBackupJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.products) setProducts(data.products);
            if (data.customers) setCustomers(data.customers);
            if (data.suppliers) setSuppliers(data.suppliers);
            if (data.employees) setEmployees(data.employees);
            if (data.transactions) setTransactions(data.transactions);
            if (data.expenses) setExpenses(data.expenses);
            if (data.profile) setProfile(data.profile);
            alert('Data Toko TB. Cincin Putih berhasil dipulihkan dari file JSON!');
          } catch (err) {
            alert('File JSON tidak valid!');
          }
        };
        reader.readAsText(file);
      };

      // KASIR POS LOGIC
      const addToCart = (product) => {
        if (product.stock <= 0) {
          alert(`Stok ${product.name} habis!`);
          return;
        }
        setCart(prev => {
          const exist = prev.find(item => item.id === product.id);
          if (exist) {
            if (exist.qty >= product.stock) {
              alert('Jumlah beli melebihi batas stok gudang!');
              return prev;
            }
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1, isWholesale: false, activePrice: product.price }];
        });
      };

      const updateQty = (id, newQty) => {
        if (newQty <= 0) {
          setCart(prev => prev.filter(item => item.id !== id));
          return;
        }
        const prod = products.find(p => p.id === id);
        if (prod && newQty > prod.stock) {
          alert('Jumlah melebihi stok yang tersedia!');
          return;
        }
        setCart(prev => prev.map(item => item.id === id ? { ...item, qty: newQty } : item));
      };

      const toggleWholesalePrice = (id) => {
        setCart(prev => prev.map(item => {
          if (item.id === id && item.wholesalePrice) {
            const nextWholesale = !item.isWholesale;
            return {
              ...item,
              isWholesale: nextWholesale,
              activePrice: nextWholesale ? item.wholesalePrice : item.price
            };
          }
          return item;
        }));
      };

      const subtotalCart = useMemo(() => cart.reduce((acc, item) => acc + (item.activePrice * item.qty), 0), [cart]);
      const discountAmount = useMemo(() => (subtotalCart * discountPercent) / 100, [subtotalCart, discountPercent]);
      const taxAmount = useMemo(() => ((subtotalCart - discountAmount) * taxPercent) / 100, [subtotalCart, discountAmount, taxPercent]);
      const grandTotal = useMemo(() => subtotalCart - discountAmount + taxAmount, [subtotalCart, discountAmount, taxPercent]);
      const changeAmount = useMemo(() => {
        const cash = Number(cashInput) || 0;
        return cash >= grandTotal ? cash - grandTotal : 0;
      }, [cashInput, grandTotal]);

      const handleCheckout = () => {
        if (cart.length === 0) return;
        if (paymentMethod === 'Tunai' && Number(cashInput) < grandTotal && cashInput !== '') {
          alert('Uang tunai kurang dari total tagihan!');
          return;
        }

        const invoiceId = 'INV-' + Date.now().toString().slice(-6);
        const newTx = {
          id: invoiceId,
          date: new Date().toLocaleString('id-ID'),
          customer: selectedCustomer,
          paymentMethod,
          items: [...cart],
          subtotal: subtotalCart,
          discount: discountAmount,
          tax: taxAmount,
          total: grandTotal,
          paid: paymentMethod === 'Tunai' ? (Number(cashInput) || grandTotal) : grandTotal,
          change: paymentMethod === 'Tunai' ? changeAmount : 0,
          profit: cart.reduce((sum, it) => sum + ((it.activePrice - it.costPrice) * it.qty), 0) - discountAmount
        };

        // Potong Stok
        setProducts(prev => prev.map(prod => {
          const itemInCart = cart.find(c => c.id === prod.id);
          return itemInCart ? { ...prod, stock: Math.max(0, prod.stock - itemInCart.qty) } : prod;
        }));

        // Catat Piutang Kasbon
        if (paymentMethod === 'Tempo / Kasbon (Hutang)') {
          setCustomers(prev => prev.map(cust => cust.name === selectedCustomer ? { ...cust, debt: cust.debt + grandTotal } : cust));
        }

        setTransactions(prev => [newTx, ...prev]);
        setPrintReceipt(newTx);
        setReceiptDocType('pos');
        setPrintMode('thermal');
        setCart([]);
        setCashInput('');
        setDiscountPercent(0);
      };

      // JIKA BELUM LOGIN (TAMPILKAN LAYAR LOGIN MANDIRI)

                          unit,
                          code: 'MAT-' + Math.floor(100 + Math.random() * 900),
                          image: 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=400'
                        };
                        setProducts(prev => [newProd, ...prev]);
                      }}
                      className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-2"
                    >
                      <i className="fa-solid fa-plus"></i> Tambah Barang Baru
                    </button>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-200">
                      <thead className="bg-slate-950 text-slate-400 text-[11px] uppercase border-b border-slate-800">
                        <tr>
                          <th className="p-3">Kode</th>
                          <th className="p-3">Nama Produk Material</th>
                          <th className="p-3">Kategori</th>
                          <th className="p-3 text-right">Harga Modal</th>
                          <th className="p-3 text-right">Harga Eceran</th>
                          <th className="p-3 text-right">Harga Partai</th>
                          <th className="p-3 text-center">Sisa Stok</th>
                          <th className="p-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {products.map(item => (
                          <tr key={item.id} className="hover:bg-slate-800/40">
                            <td className="p-3 font-mono text-emerald-400 font-bold">{item.code}</td>
                            <td className="p-3 font-bold text-slate-100">{item.name}</td>
                            <td className="p-3 text-slate-400">{item.category}</td>
                            <td className="p-3 text-right text-slate-400">{formatRupiah(item.costPrice)}</td>
                            <td className="p-3 text-right font-bold text-emerald-400">{formatRupiah(item.price)} / {item.unit}</td>
                            <td className="p-3 text-right text-teal-400 font-semibold">{item.wholesalePrice ? formatRupiah(item.wholesalePrice) : '-'}</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-1 rounded text-xs font-bold ${item.stock > 10 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}>
                                {item.stock} {item.unit}
                              </span>
                            </td>
                            <td className="p-3 text-center">
                              <button
                                onClick={() => {
                                  const newStok = prompt(`Ubah jumlah stok untuk ${item.name}:`, item.stock);
                                  if (newStok !== null) {
                                    setProducts(prev => prev.map(p => p.id === item.id ? { ...p, stock: Number(newStok) || 0 } : p));
                                  }
                                }}
                                className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold"
                              >
                                Edit Stok
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 4. RESTOCK */}
              {currentTab === 'restock' && (
                <div className="space-y-4 max-w-5xl mx-auto">
                  <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-truck-ramp-box text-emerald-400"></i>
                    Penerimaan Barang Masuk Supplier
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {suppliers.map(sup => (
                      <div key={sup.id} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="font-bold text-sm text-slate-100">{sup.name}</h3>
                            <p className="text-xs text-slate-400">Material: {sup.material}</p>
                          </div>
                          <span className="text-xs text-emerald-400">{sup.phone}</span>
                        </div>
                        <button
                          onClick={() => {
                            const namaBrg = prompt(`Pilih barang yang masuk dari ${sup.name}:`);
                            if (!namaBrg) return;
                            const qty = Number(prompt(`Jumlah barang masuk:`, '50')) || 0;
                            const target = products.find(p => p.name.toLowerCase().includes(namaBrg.toLowerCase()));
                            if (target) {
                              setProducts(prev => prev.map(p => p.id === target.id ? { ...p, stock: p.stock + qty } : p));
                              alert(`Stok ${target.name} berhasil bertambah +${qty} ${target.unit}!`);
                            } else {
                              alert('Nama barang tidak cocok.');
                            }
                          }}
                          className="w-full py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 font-bold text-xs border border-emerald-500/30"
                        >
                          + Catat Surat Jalan Masuk
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 5. DEBTS */}
              {currentTab === 'debts' && (
                <div className="space-y-4 max-w-6xl mx-auto">
                  <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-hand-holding-dollar text-emerald-400"></i>
                    Buku Catatan Piutang Mandor & Pelanggan
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                    {customers.map(cust => (
                      <div key={cust.id} className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-3 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-center">
                            <h3 className="font-bold text-sm text-slate-100">{cust.name}</h3>
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${cust.debt > 0 ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                              {cust.debt > 0 ? 'Ada Bon' : 'Lunas'}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400 mt-1">{cust.phone}</p>
                          <div className="mt-2 p-2 rounded-lg bg-slate-950">
                            <span className="text-[10px] text-slate-400 block">Sisa Hutang:</span>
                            <span className="text-base font-black text-rose-400">{formatRupiah(cust.debt)}</span>
                          </div>
                        </div>

                        <div className="flex gap-1.5 pt-2 border-t border-slate-800">
                          <button
                            onClick={() => {
                              const bayar = Number(prompt(`Nominal pembayaran cicilan bon ${cust.name}:`, '100000'));
                              if (bayar > 0) {
                                setCustomers(prev => prev.map(c => c.id === cust.id ? { ...c, debt: Math.max(0, c.debt - bayar) } : c));
                                alert(`Pembayaran kasbon ${formatRupiah(bayar)} berhasil dicatat!`);
                              }
                            }}
                            disabled={cust.debt <= 0}
                            className="flex-1 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 font-bold text-xs"
                          >
                            Bayar Bon
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 6. PAYABLES */}
              {currentTab === 'payables' && (
                <div className="space-y-4 max-w-5xl mx-auto">
                  <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-file-invoice-dollar text-emerald-400"></i>
                    Buku Tagihan & Hutang ke Pabrik
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {suppliers.map(s => (
                      <div key={s.id} className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
                        <h3 className="font-bold text-sm text-slate-100">{s.name}</h3>
                        <p className="text-xs text-slate-400">Pasokan: {s.material}</p>
                        <div className="p-2 rounded-lg bg-slate-950">
                          <span className="text-[10px] text-slate-400 block">Sisa Tagihan:</span>
                          <span className="text-base font-black text-rose-400">{formatRupiah(s.payable)}</span>
                        </div>
                        <button
                          onClick={() => {
                            const bayar = Number(prompt(`Bayar hutang ke ${s.name}:`, '1000000'));
                            if (bayar > 0) {
                              setSuppliers(prev => prev.map(sup => sup.id === s.id ? { ...sup, payable: Math.max(0, sup.payable - bayar) } : sup));
                              alert('Pembayaran hutang supplier berhasil!');
                            }
                          }}
                          disabled={s.payable <= 0}
                          className="w-full py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 font-bold text-xs"
                        >
                          Catat Pelunasan
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 7. EXPENSES */}
              {currentTab === 'expenses' && (
                <div className="space-y-4 max-w-5xl mx-auto">
                  <div className="flex justify-between items-center">
                    <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                      <i className="fa-solid fa-money-bill-trend-up text-emerald-400"></i>
                      Beban & Biaya Operasional Toko
                    </h2>
                    <button
                      onClick={() => {
                        const desc = prompt('Keterangan Biaya (Bensin, Konsumsi, Listrik):');
                        if (!desc) return;
                        const amount = Number(prompt('Nominal Biaya (Rp):', '50000')) || 0;
                        setExpenses(prev => [{ id: 'e-' + Date.now(), date: new Date().toISOString().split('T')[0], desc, amount, category: 'Operasional' }, ...prev]);
                      }}
                      className="px-3 py-1.5 rounded-xl bg-rose-500 text-white font-bold text-xs"
                    >
                      + Tambah Biaya
                    </button>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-xs text-slate-200">
                      <thead className="bg-slate-950 text-slate-400 text-[10px] uppercase border-b border-slate-800">
                        <tr>
                          <th className="p-3">Tanggal</th>
                          <th className="p-3">Keterangan</th>
                          <th className="p-3 text-right">Nominal</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {expenses.map(e => (
                          <tr key={e.id} className="hover:bg-slate-800/40">
                            <td className="p-3 font-mono text-slate-400">{e.date}</td>
                            <td className="p-3 font-bold text-slate-200">{e.desc}</td>
                            <td className="p-3 text-right font-bold text-rose-400">{formatRupiah(e.amount)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 8. FINANCE */}
              {currentTab === 'finance' && (
                <div className="space-y-4 max-w-5xl mx-auto">
                  <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-chart-line text-emerald-400"></i>
                    Laporan Laba Rugi Bersih
                  </h2>
                  <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                    <div className="flex justify-between text-sm py-2 border-b border-slate-800">
                      <span className="text-slate-400">Total Omzet Kotor:</span>
                      <span className="font-bold text-slate-100">{formatRupiah(transactions.reduce((acc, t) => acc + t.total, 0))}</span>
                    </div>
                    <div className="flex justify-between text-sm py-2 border-b border-slate-800">
                      <span className="text-slate-400">Total Laba Penjualan:</span>
                      <span className="font-bold text-emerald-400">+{formatRupiah(transactions.reduce((acc, t) => acc + t.profit, 0))}</span>
                    </div>
                    <div className="flex justify-between text-sm py-2 border-b border-slate-800">
                      <span className="text-slate-400">Total Beban Biaya:</span>
                      <span className="font-bold text-rose-400">-{formatRupiah(expenses.reduce((acc, e) => acc + e.amount, 0))}</span>
                    </div>
                    <div className="flex justify-between text-base py-3 border-t-2 border-emerald-500/40">
                      <span className="font-black text-slate-100">LABA BERSIH RIIL:</span>
                      <span className="font-black text-xl text-emerald-400">
                        {formatRupiah(
                          transactions.reduce((acc, t) => acc + t.profit, 0) - expenses.reduce((acc, e) => acc + e.amount, 0)
                        )}
                      </span>
                    </div>
                  </div>
                </div>
              )}

              {/* 9. EMPLOYEES */}
              {currentTab === 'employees' && (
                <div className="space-y-4 max-w-5xl mx-auto">
                  <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-users text-emerald-400"></i>
                    Manajemen Karyawan
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {employees.map(emp => (
                      <div key={emp.id} className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                        <div className="flex justify-between">
                          <h3 className="font-bold text-sm text-slate-100">{emp.name}</h3>
                          <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400">{emp.status}</span>
                        </div>
                        <p className="text-xs text-slate-400">Posisi: {emp.role}</p>
                        <p className="text-xs text-slate-400">Gaji: {formatRupiah(emp.salary)} / bln</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 10. SETTINGS */}
              {currentTab === 'settings' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                    <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                      <i className="fa-solid fa-store text-emerald-400"></i>
                      Profil Toko & Footer Struk
                    </h2>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Nama Toko</label>
                        <input 
                          type="text" 
                          value={profile.name} 
                          onChange={e => setProfile({ ...profile, name: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Telepon / WA</label>
                        <input 
                          type="text" 
                          value={profile.phone} 
                          onChange={e => setProfile({ ...profile, phone: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div className="sm:col-span-2">
                        <label className="text-xs text-slate-400 block mb-1">Alamat Lengkap</label>
                        <input 
                          type="text" 
                          value={profile.address} 
                          onChange={e => setProfile({ ...profile, address: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl bg-slate-900 border border-emerald-500/30 space-y-4">
                    <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                      <i className="fa-solid fa-database text-emerald-400"></i>
                      Cadangan Data Mandiri (JSON Backup)
                    </h2>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <button
                        onClick={handleExportBackupJson}
                        className="p-4 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center gap-3 transition-colors text-left shadow-sm"
                      >
                        <i className="fa-solid fa-file-arrow-down text-3xl"></i>
                        <div>
                          <div className="font-bold text-xs">Export Data Backup (JSON)</div>
                          <div className="text-[10px] text-slate-400">Simpan seluruh 24 barang, transaksi & kasbon ke .json</div>
                        </div>
                      </button>

                      <div 
                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                        className="p-4 rounded-xl bg-slate-950 hover:bg-slate-900 border border-slate-800 text-slate-200 flex items-center gap-3 transition-colors text-left cursor-pointer shadow-sm"
                      >
                        <i className="fa-solid fa-file-arrow-up text-3xl text-sky-400"></i>
                        <div>
                          <div className="font-bold text-xs">Restore Data dari File JSON</div>
                          <div className="text-[10px] text-slate-400">Pulihkan database dari file cadangan.</div>
                        </div>
                        <input 
                          type="file" 
                          ref={fileInputRef} 
                          onChange={handleImportBackupJson} 
                          accept=".json" 
                          className="hidden" 
                        />
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* MODAL CETAK NOTA */}
          {printReceipt && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-2xl p-6 max-w-lg w-full font-mono text-xs shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <span className="font-bold text-slate-700 text-xs">Pilih Format Cetak:</span>
                  <div className="flex gap-1">
                    <button
                      onClick={() => setPrintMode('thermal')}
                      className={`px-2.5 py-1 rounded text-xs font-bold ${printMode === 'thermal' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-700'}`}
                    >
                      Thermal 58/80mm
                    </button>
                    <button
                      onClick={() => setPrintMode('dotmatrix')}
                      className={`px-2.5 py-1 rounded text-xs font-bold ${printMode === 'dotmatrix' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-700'}`}
                    >
                      Dot Matrix / A4
                    </button>
                  </div>
                </div>

                <div id="printable-area" className={printMode === 'thermal' ? 'thermal-mode' : 'dotmatrix-mode'}>
                  <div className="text-center border-b border-dashed border-slate-400 pb-2 mb-2">
                    <h2 className="font-bold text-sm sm:text-base tracking-wider uppercase">{profile.name}</h2>
                    <p className="text-[10px]">{profile.address}</p>
                    <p className="text-[10px]">Telp/WA: {profile.phone}</p>
                    <div className="mt-1 font-bold text-[11px] uppercase tracking-widest">
                      *** STRUK KASIR PENJUALAN ***
                    </div>
                  </div>

                  <div className="flex justify-between text-[10px] mb-1">
                    <span>No. Nota: <strong>{printReceipt.id}</strong></span>
                    <span>Tgl: {printReceipt.date}</span>
                  </div>
                  <div className="text-[10px] mb-2">
                    <span>Pelanggan: <strong>{printReceipt.customer}</strong></span>
                  </div>

                  <div className="border-t border-b border-dashed border-slate-400 py-1.5 space-y-1.5 my-1">
                    {printReceipt.items.map((item, i) => (
                      <div key={i} className="flex justify-between text-[11px]">
                        <div>
                          <div className="font-bold">{item.name}</div>
                          <div className="text-[10px] text-slate-600">
                            {item.qty} {item.unit} x {formatRupiah(item.activePrice)}
                          </div>
                        </div>
                        <span className="font-bold">{formatRupiah(item.activePrice * item.qty)}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-1 text-right text-[11px] pt-1">
                    {printReceipt.discount > 0 && (
                      <div className="flex justify-between text-slate-600">
                        <span>Diskon:</span>
                        <span>-{formatRupiah(printReceipt.discount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between font-black text-xs sm:text-sm pt-1 border-t border-slate-300">
                      <span>TOTAL AKHIR:</span>
                      <span>{formatRupiah(printReceipt.total)}</span>
                    </div>
                    <div className="flex justify-between text-slate-600 text-[10px]">
                      <span>Metode:</span>
                      <span>{printReceipt.paymentMethod}</span>
                    </div>
                    {printReceipt.paymentMethod === 'Tunai' && (
                      <>
                        <div className="flex justify-between text-slate-600 text-[10px]">
                          <span>Bayar:</span>
                          <span>{formatRupiah(printReceipt.paid)}</span>
                        </div>
                        <div className="flex justify-between text-slate-600 text-[10px]">
                          <span>Kembali:</span>
                          <span>{formatRupiah(printReceipt.change)}</span>
                        </div>
                      </>
                    )}
                  </div>

                  <div className="text-center text-[9px] text-slate-500 border-t border-dashed border-slate-400 pt-2 mt-2">
                    {profile.footer}
                  </div>
                </div>

                <div className="flex gap-2 pt-2 border-t border-slate-200">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg"
                  >
                    <i className="fa-solid fa-print"></i> Cetak Struk Sekarang
                  </button>
                  <button
                    onClick={() => setPrintReceipt(null)}
                    className="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
