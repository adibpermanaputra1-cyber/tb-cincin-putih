    // ========================================================
    // 🖨️ FUNGSI GENERATOR PERINTAH BINARY ESC/POS UNTUK BLUETOOTH
    // ========================================================
    function generateEscPosCommands(receipt, profile, paperWidth = 58) {
      const maxChars = paperWidth === 80 ? 48 : 32;
      const encoder = new TextEncoder();
      const chunks = [];

      const addRaw = (bytes) => chunks.push(new Uint8Array(bytes));
      const addText = (str) => chunks.push(encoder.encode(str));

      // ESC/POS Command Constants
      const ESC = 0x1B;
      const GS = 0x1D;

      // Inisialisasi printer & reset setting
      addRaw([ESC, 0x40]);

      // Rata Tengah (Align Center)
      addRaw([ESC, 0x61, 0x01]);

      // Judul Toko (Bold + Double Height)
      addRaw([ESC, 0x45, 0x01]); // Bold ON
      addRaw([GS, 0x21, 0x11]);  // Double Height/Width
      addText((profile.name || 'TB. CINCIN PUTIH') + '\n');
      
      // Normal Font
      addRaw([GS, 0x21, 0x00]);  // Normal size
      addRaw([ESC, 0x45, 0x00]); // Bold OFF
      addText((profile.address || 'Jl. Cincin Putih Raya') + '\n');
      addText('Telp/WA: ' + (profile.phone || '-') + '\n');
      addText('*** NOTA RESMI KASIR ***\n');

      // Garis Pembatas
      addText('-'.repeat(maxChars) + '\n');

      // Rata Kiri (Align Left)
      addRaw([ESC, 0x61, 0x00]);
      addText(`No.Nota: ${receipt.id}\n`);
      addText(`Tanggal: ${receipt.date}\n`);
      addText(`Mandor : ${receipt.customer}\n`);
      addText('-'.repeat(maxChars) + '\n');

      // Rincian Barang
      receipt.items.forEach((item) => {
        addRaw([ESC, 0x45, 0x01]); // Bold item name
        addText(`${item.name}\n`);
        addRaw([ESC, 0x45, 0x00]); // Bold OFF

        const qtyPrice = `  ${item.qty} ${item.sellingUnit} x ${item.activePrice.toLocaleString('id-ID')}`;
        const totalItem = (item.qty * item.activePrice).toLocaleString('id-ID');
        const spaces = Math.max(1, maxChars - qtyPrice.length - totalItem.length);
        addText(qtyPrice + ' '.repeat(spaces) + totalItem + '\n');
      });

      addText('-'.repeat(maxChars) + '\n');

      // Bagian Total (Align Right)
      addRaw([ESC, 0x61, 0x02]); // Align Right
      if (receipt.discount > 0) {
        addText(`Diskon: -Rp ${receipt.discount.toLocaleString('id-ID')}\n`);
      }

      addRaw([ESC, 0x45, 0x01]); // Bold ON
      addText(`TOTAL: Rp ${receipt.total.toLocaleString('id-ID')}\n`);
      addRaw([ESC, 0x45, 0x00]); // Bold OFF

      addText(`Metode: ${receipt.paymentMethod}\n`);
      if (receipt.paymentMethod === 'Tunai') {
        addText(`Bayar : Rp ${(receipt.paid || receipt.total).toLocaleString('id-ID')}\n`);
        addText(`Kembali: Rp ${(receipt.change || 0).toLocaleString('id-ID')}\n`);
      }

      // Garis Pembatas & Footer
      addRaw([ESC, 0x61, 0x01]); // Align Center
      addText('-'.repeat(maxChars) + '\n');
      addText((profile.footer || 'Barang yang sudah dibeli tidak dapat ditukar/dikembalikan.') + '\n');
      addText('Terima Kasih Atas Kunjungan Anda\n\n\n');

      // Perintah Pemotong Kertas Otomatis (Auto-Cut) & Feed 3 baris
      addRaw([GS, 0x56, 0x41, 0x03]);

      // Gabungkan seluruh Uint8Array menjadi satu Buffer utuh
      const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
      const combined = new Uint8Array(totalLen);
      let offset = 0;
      for (const chunk of chunks) {
        combined.set(chunk, offset);
        offset += chunk.length;
      }
      return combined;
    }

      const printDirectBluetooth = async (receipt, paperWidth = 58) => {
        if (!navigator.bluetooth) {
          alert('Browser Anda belum mendukung Web Bluetooth API. Silakan gunakan Google Chrome di HP Android / Laptop, atau gunakan tombol "Cetak via Driver System".');
          return;
        }

        try {
          setIsBluetoothPrinting(true);
          setBluetoothStatus('Memindai printer Bluetooth terdekat...');

          // Request Bluetooth Device
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '000018f0-0000-1000-8000-00805f9b34fb',
              'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
              '49535343-fe7d-4ae5-8fa9-9fafd205e455',
              '0000ff00-0000-1000-8000-00805f9b34fb',
              '0000fee7-0000-1000-8000-00805f9b34fb'
            ]
          });

          setBluetoothStatus(`Menghubungkan ke ${device.name || 'Printer Thermal'}...`);
          const server = await device.gatt.connect();

          // Cari Service & Karakteristik yang Bisa Ditulis (Write)
          const services = await server.getPrimaryServices();
          let writeChar = null;

          for (const service of services) {
            try {
              const characteristics = await service.getCharacteristics();
              for (const c of characteristics) {
                if (c.properties.write || c.properties.writeWithoutResponse) {
                  writeChar = c;
                  break;
                }
              }
              if (writeChar) break;
            } catch (err) {
              console.warn('Gagal membaca karakteristik service:', err);
            }
          }

          if (!writeChar) {
            throw new Error('Tidak dapat menemukan jalur pengiriman data (Write Characteristic) pada printer ini.');
          }

          setBluetoothStatus('Mengirim data struk ESC/POS...');
          const escPosData = generateEscPosCommands(receipt, profile, paperWidth);

          // Kirim per chunk (512 byte) agar tidak buffer overflow
          const CHUNK_SIZE = 512;
          for (let i = 0; i < escPosData.length; i += CHUNK_SIZE) {
            const slice = escPosData.slice(i, i + CHUNK_SIZE);
            if (writeChar.writeValueWithoutResponse) {
              await writeChar.writeValueWithoutResponse(slice);
            } else {
              await writeChar.writeValue(slice);
            }
          }

          setBluetoothStatus('Struk berhasil dikirim ke printer!');
          setTimeout(() => {
            setBluetoothStatus('');
            setIsBluetoothPrinting(false);
          }, 1500);

        } catch (error) {
          console.error('Bluetooth Print Error:', error);
          alert('Gagal cetak Bluetooth: ' + (error.message || error));
          setIsBluetoothPrinting(false);
          setBluetoothStatus('');
        }
      };

                        placeholder="Contoh: SMN-01"
                        value={productFormData.code}
                        onChange={e => setProductFormData({ ...productFormData, code: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs font-mono text-emerald-400 font-bold uppercase focus:outline-none"
                      />
                    </div>
                    <div className="sm:col-span-8">
                      <label className="text-xs font-semibold text-slate-300 block mb-1">
                        Kategori Material <span className="text-emerald-400">*</span>
                      </label>
                      <select 
                        value={productFormData.category}
                        onChange={e => setProductFormData({ ...productFormData, category: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none"
                      >
                        {CATEGORY_OPTIONS.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Baris 2: Nama Lengkap Material & Satuan Utama */}
                  <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                    <div className="sm:col-span-8">
                      <label className="text-xs font-semibold text-slate-300 block mb-1">
                        Nama Lengkap Material <span className="text-emerald-400">*</span>
                      </label>
                      <input 
                        type="text"
                        required
                        placeholder="Contoh: Semen Tiga Roda 50kg"
                        value={productFormData.name}
                        onChange={e => setProductFormData({ ...productFormData, name: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-slate-100 font-bold focus:outline-none"
                      />
                    </div>
                    <div className="sm:col-span-4">
                      <label className="text-xs font-semibold text-slate-300 block mb-1">
                        Satuan Utama (Base Unit) <span className="text-emerald-400">*</span>
                      </label>
                      <select 
                        value={productFormData.unit}
                        onChange={e => setProductFormData({ ...productFormData, unit: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-slate-100 font-bold focus:outline-none"
                      >
                        {BASE_UNIT_OPTIONS.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Baris 3: Harga Jual Satuan Utama */}
                  <div className="p-3.5 rounded-2xl bg-slate-950/80 border border-slate-800/80 space-y-2.5">
                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                      <i className="fa-solid fa-coins text-amber-400"></i> Harga Jual Satuan Utama ({productFormData.unit})
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="text-[11px] text-slate-400 block mb-1">Harga Beli Modal (HPP)</label>
                        <input 
                          type="number"
                          min="0"
                          placeholder="0"
                          value={productFormData.costPrice}
                          onChange={e => setProductFormData({ ...productFormData, costPrice: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-slate-100 font-semibold focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-emerald-400 font-semibold block mb-1">Harga Jual Retail ({productFormData.unit})</label>
                        <input 
                          type="number"
                          min="0"
                          placeholder="0"
                          value={productFormData.price}
                          onChange={e => setProductFormData({ ...productFormData, price: e.target.value })}
                          className="w-full bg-slate-900 border border-emerald-500/50 focus:border-emerald-400 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] text-teal-400 font-semibold block mb-1">Harga Grosir ({productFormData.unit})</label>
                        <input 
                          type="number"
                          min="0"
                          placeholder="0"
                          value={productFormData.wholesalePrice}
                          onChange={e => setProductFormData({ ...productFormData, wholesalePrice: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-800 focus:border-teal-400 rounded-xl px-3 py-2 text-xs text-teal-400 font-bold focus:outline-none"
                        />
                      </div>
                    </div>
                  </div>

                  {/* ==================================================== */}
                  {/* 🔗 BAGIAN DINAMIS: KONFIGURASI SATUAN TURUNAN       */}
                  {/* ==================================================== */}
                  <div className="p-4 rounded-2xl bg-slate-950 border border-teal-500/30 space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <i className="fa-solid fa-layer-group text-teal-400"></i>
                        <span className="text-xs font-bold text-slate-100">Konfigurasi Multi-Satuan / Satuan Turunan</span>
                      </div>
                      <span className="text-[10px] text-slate-400">
                        Base: <strong>1 {productFormData.unit}</strong>
                      </span>
                    </div>

                    {/* Input Dinamis Satuan Turunan */}
                    <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-slate-900/90 p-3 rounded-xl border border-slate-800 items-end">
                      <div className="sm:col-span-4">
                        <label className="text-[10px] font-semibold text-slate-300 block mb-1">Nama Satuan Turunan</label>
                        <input 
                          type="text"
                          placeholder="Contoh: Kg, Ons, Meter"
                          value={newDerivedName}
                          onChange={e => setNewDerivedName(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 focus:border-teal-400 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none"
                        />
                      </div>
                      <div className="sm:col-span-3">
                        <label className="text-[10px] font-semibold text-slate-300 block mb-1">Konversi per 1 {productFormData.unit}</label>
                        <input 
                          type="number"
                          step="any"
                          min="0.001"
                          placeholder="Contoh: 50"
                          value={newDerivedRatio}
                          onChange={e => setNewDerivedRatio(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 focus:border-teal-400 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 font-mono text-center focus:outline-none"
                        />
                      </div>
                      <div className="sm:col-span-3">
                        <label className="text-[10px] font-semibold text-teal-400 block mb-1">Harga Jual Turunan (Rp)</label>
                        <input 
                          type="number"
                          min="0"
                          placeholder="Contoh: 2500"
                          value={newDerivedPrice}
                          onChange={e => setNewDerivedPrice(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 focus:border-teal-400 rounded-lg px-2.5 py-1.5 text-xs text-teal-300 font-bold focus:outline-none"
                        />
                      </div>
                      <div className="sm:col-span-2">
                        <button
                          type="button"
                          onClick={handleAddDerivedUnit}
                          className="w-full py-1.5 px-3 rounded-lg bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1 transition-colors shadow-sm"
                        >
                          <i className="fa-solid fa-plus text-[10px]"></i> Tambah
                        </button>
                      </div>
                    </div>

                    {/* Tabel Daftar Satuan Turunan Tersimpan */}
                    {productFormData.derivedUnits.length > 0 ? (
                      <div className="overflow-x-auto rounded-xl border border-slate-800">
                        <table className="w-full text-left text-xs text-slate-200">
                          <thead className="bg-slate-900 text-slate-400 text-[10px] uppercase border-b border-slate-800">
                            <tr>
                              <th className="p-2.5">Satuan Turunan</th>
                              <th className="p-2.5 text-center">Rasio Konversi</th>
                              <th className="p-2.5 text-right">Harga Jual Eceran</th>
                              <th className="p-2.5 text-center">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 bg-slate-950">
                            {productFormData.derivedUnits.map(unitItem => (
                              <tr key={unitItem.id} className="hover:bg-slate-900/50">
                                <td className="p-2.5 font-bold text-teal-300 flex items-center gap-1.5">
                                  <i className="fa-solid fa-arrow-right text-[10px] text-teal-500"></i>
                                  {unitItem.name}
                                </td>
                                <td className="p-2.5 text-center font-mono text-slate-300">
                                  1 {productFormData.unit} = <strong>{unitItem.conversionRatio}</strong> {unitItem.name}
                                </td>
                                <td className="p-2.5 text-right font-extrabold text-emerald-400">
                                  {formatRupiah(unitItem.price)} / {unitItem.name}
                                </td>
                                <td className="p-2.5 text-center">
                                  <button
                                    type="button"
                                    onClick={() => handleRemoveDerivedUnit(unitItem.id)}
                                    className="px-2 py-0.5 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-[10px] font-bold"
                                  >
                                    <i className="fa-solid fa-trash mr-1"></i> Hapus
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    ) : (
                      <div className="text-center py-2.5 text-[11px] text-slate-500 border border-dashed border-slate-800 rounded-xl">
                        Belum ada satuan turunan yang ditambahkan.
                      </div>
                    )}
                  </div>

                  {/* Baris 4: Stok Fisik & Lokasi Rak */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1">
                        Stok Fisik ({productFormData.unit}) <span className="text-emerald-400">*</span>
                      </label>
                      <input 
                        type="number"
                        min="0"
                        required
                        placeholder="0"
                        value={productFormData.stock}
                        onChange={e => setProductFormData({ ...productFormData, stock: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-slate-100 font-bold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1">Peringatan Min. Stok</label>
                      <input 
                        type="number"
                        min="0"
                        placeholder="10"
                        value={productFormData.minStock}
                        onChange={e => setProductFormData({ ...productFormData, minStock: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-rose-400 font-semibold focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1">Lokasi Rak / Gudang</label>
                      <input 
                        type="text"
                        placeholder="Contoh: Rak Besi B-02"
                        value={productFormData.location}
                        onChange={e => setProductFormData({ ...productFormData, location: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Tombol Aksi Simpan */}
                  <div className="flex gap-2.5 pt-3 border-t border-slate-800">
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition-all active:scale-[0.98]"
                    >
                      <i className="fa-solid fa-floppy-disk"></i>
                      {editingProduct ? 'Simpan Perubahan Material' : 'Simpan Material Baru ke Database'}
                    </button>
                    <button
                      type="button"
                      onClick={() => setIsProductModalOpen(false)}
                      className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition-colors"
                    >
                      Batal
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* 🖨️ 2. MODAL CETAK STRUK BLUETOOTH & SYSTEM PRINT         */}
          {/* ======================================================== */}
          {printReceipt && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3 sm:p-4 no-print overflow-y-auto">
              <div className="bg-white text-slate-900 rounded-2xl p-5 sm:p-6 max-w-lg w-full font-mono text-xs shadow-2xl space-y-4 max-h-[95vh] overflow-y-auto">
                
                {/* Pilihan Toggle Format Ukuran Kertas */}
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-3 border-b border-slate-200 gap-2">
                  <span className="font-bold text-slate-800 text-xs">Pilih Ukuran Kertas:</span>
                  <div className="flex gap-1">
                    <button 
                      type="button"
                      onClick={() => setPrintFormat('thermal58')} 
                      className={`px-2.5 py-1 rounded text-xs font-bold transition-colors ${printFormat === 'thermal58' ? 'bg-slate-950 text-white' : 'bg-slate-200 text-slate-700'}`}
                    >
                      Thermal 58mm
                    </button>
                    <button 
                      type="button"
                      onClick={() => setPrintFormat('thermal80')} 
                      className={`px-2.5 py-1 rounded text-xs font-bold transition-colors ${printFormat === 'thermal80' ? 'bg-slate-950 text-white' : 'bg-slate-200 text-slate-700'}`}
                    >
                      Thermal 80mm
                    </button>
                    <button 
                      type="button"
                      onClick={() => setPrintFormat('dotmatrix')} 
                      className={`px-2.5 py-1 rounded text-xs font-bold transition-colors ${printFormat === 'dotmatrix' ? 'bg-slate-950 text-white' : 'bg-slate-200 text-slate-700'}`}
                    >
                      Dot Matrix / A4
                    </button>
                  </div>
                </div>

                {/* Status Bluetooth Scanner */}
                {bluetoothStatus && (
                  <div className="p-3 rounded-xl bg-sky-50 border border-sky-200 text-sky-800 text-xs font-semibold flex items-center gap-2 animate-pulse">
                    <i className="fa-brands fa-bluetooth text-base text-sky-600"></i>
                    <span>{bluetoothStatus}</span>
                  </div>
                )}

                {/* AREA TAMPILAN STRUK */}
                <div 
                  id="printable-area" 
                  className={`mx-auto bg-white text-black ${
                    printFormat === 'thermal58' ? 'max-w-[54mm]' : printFormat === 'thermal80' ? 'max-w-[76mm]' : 'w-full'
                  }`}
                >
                  <div className="text-center border-b border-dashed border-black pb-2 mb-2">
                    <h2 className="font-black text-xs sm:text-sm tracking-wider uppercase">{profile.name}</h2>
                    <p className="text-[9px] sm:text-[10px] leading-tight">{profile.address}</p>
                    <p className="text-[9px] sm:text-[10px]">Telp/WA: {profile.phone}</p>
                    <div className="mt-1 font-bold text-[10px] sm:text-[11px] uppercase tracking-widest">
                      {printFormat === 'dotmatrix' ? '*** FAKTUR PENJUALAN & SURAT JALAN ***' : '*** STRUK PENJUALAN RESMI ***'}
                    </div>
                  </div>

                  <div className="flex justify-between text-[9px] sm:text-[10px] mb-1">
                    <span>No: <strong>{printReceipt.id}</strong></span>
                    <span>Tgl: {printReceipt.date}</span>
                  </div>
                  <div className="text-[9px] sm:text-[10px] mb-2">
                    <span>Pelanggan: <strong>{printReceipt.customer}</strong></span>
                  </div>

                  {/* Tabel Daftar Belanja */}
                  <div className="border-t border-b border-dashed border-black py-1.5 space-y-1.5 my-1">
                    {printReceipt.items.map((item, i) => (
                      <div key={i} className="flex justify-between text-[10px] sm:text-[11px] leading-tight">
                        <div className="pr-1">
                          <div className="font-bold">{item.name}</div>
                          <div className="text-[9px] sm:text-[10px] text-gray-700">
                            {item.qty} {item.sellingUnit} x {formatRupiah(item.activePrice)}
                          </div>
                        </div>
                        <span className="font-bold shrink-0">{formatRupiah(item.activePrice * item.qty)}</span>
                      </div>
                    ))}
                  </div>

                  {/* Rincian Total */}
                  <div className="space-y-1 text-right text-[10px] sm:text-[11px] pt-1">
                    {printReceipt.discount > 0 && (
                      <div className="flex justify-between text-gray-700">
                        <span>Diskon:</span>
                        <span>-{formatRupiah(printReceipt.discount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between font-black text-xs sm:text-sm pt-1 border-t border-black">
                      <span>TOTAL TAGIHAN:</span>
                      <span>{formatRupiah(printReceipt.total)}</span>
                    </div>
                    <div className="flex justify-between text-gray-700 text-[9px] sm:text-[10px]">
                      <span>Metode Pembayaran:</span>
                      <span>{printReceipt.paymentMethod}</span>
                    </div>
                    {printReceipt.paymentMethod === 'Tunai' && (
                      <>
                        <div className="flex justify-between text-gray-700 text-[9px] sm:text-[10px]">
                          <span>Tunai Diterima:</span>
                          <span>{formatRupiah(printReceipt.paid)}</span>
                        </div>
                        <div className="flex justify-between text-gray-700 text-[9px] sm:text-[10px]">
                          <span>Kembalian:</span>
                          <span>{formatRupiah(printReceipt.change)}</span>
                        </div>
                      </>
                    )}
                  </div>

                  {/* Format Tanda Tangan untuk Dot Matrix / Faktur Pengiriman */}
                  {printFormat === 'dotmatrix' && (
                    <div className="grid grid-cols-3 gap-2 pt-6 text-center text-[9px]">
                      <div>
                        <div>Penerima / Mandor,</div>
                        <div className="h-10"></div>
                        <div className="border-t border-black font-bold">( {printReceipt.customer} )</div>
                      </div>
                      <div>
                        <div>Supir / Pengirim,</div>
                        <div className="h-10"></div>
                        <div className="border-t border-black font-bold">( .................... )</div>
                      </div>
                      <div>
                        <div>Hormat Kami / Kasir,</div>
                        <div className="h-10"></div>
                        <div className="border-t border-black font-bold">( TB. Cincin Putih )</div>
                      </div>
                    </div>
                  )}

                  <div className="text-center text-[8px] sm:text-[9px] text-gray-700 border-t border-dashed border-black pt-2 mt-2 leading-tight">
                    {profile.footer}
                  </div>
                </div>

                {/* TOMBOL AKSI CETAK: BLUETOOTH ESC/POS & SYSTEM PRINT */}
                <div className="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-200">
                  {/* Tombol Cetak Bluetooth ESC/POS */}
                  <button 
                    type="button"
                    disabled={isBluetoothPrinting}
                    onClick={() => printDirectBluetooth(printReceipt, printFormat === 'thermal80' ? 80 : 58)} 
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg transition-all"
                  >
                    <i className="fa-brands fa-bluetooth text-sm"></i>
                    <span>{isBluetoothPrinting ? 'Sedang Mencetak...' : 'Cetak Bluetooth (ESC/POS)'}</span>
                  </button>

                  {/* Tombol Cetak USB / Driver Windows */}
                  <button 
                    type="button"
                    onClick={() => executeSystemPrint(printFormat)} 
                    className="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 transition-colors"
                  >
                    <i className="fa-solid fa-print"></i>
                    <span>Cetak System / PDF</span>
                  </button>

                  {/* Tombol Tutup */}
                  <button 
                    type="button"
                    onClick={() => setPrintReceipt(null)} 
                    className="px-3.5 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs transition-colors"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
